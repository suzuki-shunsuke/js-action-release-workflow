---
name: Release JavaScript Action
on:
  workflow_call:
    inputs:
      version:
        description: A released version. One of `pr/<pr number>`, `latest`, or tag vX.Y.Z.
        required: true
        type: string
      pr:
        description: |
          Pull Request Number.
          If this is set, the merge commit of the pull request (refs/pull/<pr>/merge) is released,
          which is the commit that the pull request is merged into the base branch.
        required: false
        type: string
      is_comment:
        description: If the comment is posted to the pull request
        required: false
        default: false
        type: boolean
      files:
        description: Files to be committed in addition to dist. This is passed to suzuki-shunsuke/release-js-action
        required: false
        type: string
      working_directory:
        description: The directory where package.json and package-lock.json exist
        required: false
        type: string
        default: "."
      node-version-file:
        required: false
        type: string
        default: .node-version
      build_command:
        description: The command to build the action. This is run in working_directory
        required: false
        type: string
        default: npm run build
      aqua_version:
        description: If this is set, aqua is installed before building the action, so the build command can use tools managed by aqua
        required: false
        type: string
      artifact_suffix:
        description: |
          A suffix of artifact names.
          Artifact names must be unique in a workflow run, so set this when this workflow is called multiple times in a workflow run.
        required: false
        type: string
        default: ""
      npm_artifact_name:
        description: |
          The name of the artifact created by suzuki-shunsuke/download-npm-package-action in the caller workflow.
          If this is set, the npm job is skipped and the artifact is used instead,
          so the caller can share the artifact with other jobs such as suzuki-shunsuke/js-action-test-workflow.
          Set ref to the commit where the artifact was created (the output sha of download-npm-package-action's reusable workflow).
        required: false
        type: string
      ref:
        description: |
          The git ref to build and release. This takes precedence over pr.
          If npm_artifact_name is set, set this to the commit where the artifact was created.
        required: false
        type: string
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false
    outputs:
      sha:
        description: The commit SHA where the action was built
        value: ${{jobs.build.outputs.sha}}

permissions: {}

jobs:
  npm:
    # Install npm packages through Takumi Guard, which requires id-token: write.
    # The release job runs code of the repository and its dependencies with contents: write,
    # so it must not have id-token: write.
    # node_modules is passed to the release job via an artifact.
    # Skipped if the caller passes its own artifact via npm_artifact_name.
    if: inputs.npm_artifact_name == ''
    uses: suzuki-shunsuke/download-npm-package-action/.github/workflows/download.yaml@7b0c4cea0dbf5a58ec2b35c3c6432584369c1bfe # v0.0.2
    permissions:
      contents: read
      id-token: write
    with:
      # Release the merge commit of the pull request, so the release and the tests of the action use the code merged into the base branch.
      # refs/pull/<pr>/merge exists while the pull request is open and has no conflict.
      ref: ${{inputs.ref || (inputs.pr != '' && format('refs/pull/{0}/merge', inputs.pr)) || ''}}
      working_directory: ${{inputs.working_directory}}
      node-version-file: ${{inputs.node-version-file}}
      artifact_name: node_modules-release${{inputs.artifact_suffix}}
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  # Build the action in a job without contents: write and pull-requests: write.
  # Building the action runs code of the repository and its dependencies (install scripts, the build command, and so on).
  # If it ran in the job pushing the release branch, compromised dependencies could abuse the write permission,
  # e.g. in a pull request updating dependencies before it is reviewed.
  build:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: npm
    # Run even if the npm job is skipped because npm_artifact_name is set
    if: |
      !cancelled() && (needs.npm.result == 'success' || needs.npm.result == 'skipped')
    permissions:
      contents: read
    outputs:
      sha: ${{steps.sha.outputs.value}}
    steps:
      - name: Checkout the commit where npm packages were installed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # If the npm job is skipped, the caller's ref (or the merge commit of the pull request) is used
          ref: ${{needs.npm.outputs.sha || inputs.ref || (inputs.pr != '' && format('refs/pull/{0}/merge', inputs.pr)) || ''}}
          persist-credentials: false

      - name: Get the commit SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{inputs.node-version-file}}

      - name: Restore node_modules
        uses: suzuki-shunsuke/download-npm-package-action/restore@7b0c4cea0dbf5a58ec2b35c3c6432584369c1bfe # v0.0.2
        with:
          working_directory: ${{inputs.working_directory}}
          artifact_name: ${{inputs.npm_artifact_name || format('node_modules-release{0}', inputs.artifact_suffix)}}

      - name: Install aqua
        if: inputs.aqua_version != ''
        uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: ${{inputs.aqua_version}}

      - name: Build the action
        working-directory: ${{inputs.working_directory}}
        env:
          BUILD_COMMAND: ${{inputs.build_command}}
          AQUA_GITHUB_TOKEN: ${{github.token}}
        run: bash -c "$BUILD_COMMAND"

      # Collect files committed by release-js-action: dist directories and inputs.files.
      # release-js-action commits **/dist/** except node_modules.
      - name: Collect files to be released
        env:
          FILES: ${{inputs.files}}
        run: |
          stage=$RUNNER_TEMP/js-action-release-workflow/release-files
          mkdir -p "$stage"
          find . \( -name node_modules -o -name .git \) -prune -o -type f -path '*/dist/*' -print0 |
            xargs -0 -r cp --parents -t "$stage"
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              cp --parents "$file" "$stage"
            fi
          done <<< "$FILES"

      - name: Upload files to be released
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files${{inputs.artifact_suffix}}
          path: ${{runner.temp}}/js-action-release-workflow/release-files
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      # Callers can test the built action by downloading this artifact
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist${{inputs.artifact_suffix}}
          path: ${{inputs.working_directory}}/dist
          retention-days: 1

  # Push the release branch.
  # This job must not run code of the repository and its dependencies because it has contents: write.
  release:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: write # To push the release branch
      pull-requests: write # To post comments to pull requests
    steps:
      - name: Checkout the commit where the action was built
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{needs.build.outputs.sha}}
          persist-credentials: false

      - name: Download files to be released
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files${{inputs.artifact_suffix}}
          path: ${{runner.temp}}/js-action-release-workflow/release-files

      # The artifact is created by the build job, which runs code of dependencies.
      # Don't extract it into the workspace as is. Copy only files that release-js-action commits,
      # so that a compromised build job can't put files such as .git/config into the workspace.
      - name: Copy files to be released
        env:
          FILES: ${{inputs.files}}
        run: |
          stage=$RUNNER_TEMP/js-action-release-workflow/release-files
          cd "$stage"
          find . -type f -print0 | while IFS= read -r -d '' file; do
            file=${file#./}
            case "/$file" in
              */.git/* | */node_modules/* | */../*)
                echo "::error::Unexpected file in the artifact: $file"
                exit 1
                ;;
            esac
            allowed=false
            case "/$file" in
              */dist/*) allowed=true ;;
            esac
            if [ "$allowed" = false ]; then
              while IFS= read -r f; do
                if [ -n "$f" ] && [ "${f#./}" = "$file" ]; then
                  allowed=true
                fi
              done <<< "$FILES"
            fi
            if [ "$allowed" = false ]; then
              echo "::error::Unexpected file in the artifact: $file"
              exit 1
            fi
            mkdir -p "$GITHUB_WORKSPACE/$(dirname "$file")"
            cp "$file" "$GITHUB_WORKSPACE/$file"
          done

      # Pull requests from forks can't push branches, so only build them
      - name: Release the action
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: suzuki-shunsuke/release-js-action@ff106e3a3f5b34f174a23db3110031fbf463f15c # v0.2.1
        with:
          version: ${{inputs.version}}
          pr: ${{inputs.pr}}
          is_comment: ${{inputs.is_comment}}
          files: ${{inputs.files}}
