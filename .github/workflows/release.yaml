---
name: Release JavaScript Action
on:
  workflow_call:
    inputs:
      version:
        description: A released version. One of `pr/<pr number>`, `latest`, or tag vX.Y.Z.
        required: true
        type: string
      pr:
        description: |
          Pull Request Number.
          If this is set, the head commit of the pull request is released.
        required: false
        type: string
      is_comment:
        description: If the comment is posted to the pull request
        required: false
        default: false
        type: boolean
      files:
        description: Files to be committed in addition to dist. This is passed to suzuki-shunsuke/release-js-action
        required: false
        type: string
      working_directory:
        description: The directory where package.json and package-lock.json exist
        required: false
        type: string
        default: "."
      node-version-file:
        required: false
        type: string
        default: .node-version
      build_command:
        description: The command to build the action. This is run in working_directory
        required: false
        type: string
        default: npm run build
      aqua_version:
        description: If this is set, aqua is installed before building the action, so the build command can use tools managed by aqua
        required: false
        type: string
      artifact_suffix:
        description: |
          A suffix of artifact names.
          Artifact names must be unique in a workflow run, so set this when this workflow is called multiple times in a workflow run.
        required: false
        type: string
        default: ""
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false
    outputs:
      sha:
        description: The commit SHA where the action was built
        value: ${{jobs.npm.outputs.sha}}

permissions: {}

jobs:
  npm:
    # Install npm packages through Takumi Guard, which requires id-token: write.
    # The release job runs code of the repository and its dependencies with contents: write,
    # so it must not have id-token: write.
    # node_modules is passed to the release job via an artifact.
    uses: suzuki-shunsuke/download-npm-package-action/.github/workflows/download.yaml@main
    permissions:
      contents: read
      id-token: write
    with:
      # Release the head commit of the pull request instead of the merge commit
      ref: ${{inputs.pr != '' && format('refs/pull/{0}/head', inputs.pr) || ''}}
      working_directory: ${{inputs.working_directory}}
      node-version-file: ${{inputs.node-version-file}}
      artifact_name: node_modules-release${{inputs.artifact_suffix}}
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  release:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: npm
    permissions:
      contents: write # To push the release branch
      pull-requests: write # To post comments to pull requests
    steps:
      - name: Checkout the commit where npm packages were installed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{needs.npm.outputs.sha}}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{inputs.node-version-file}}

      - name: Restore node_modules
        uses: suzuki-shunsuke/download-npm-package-action/restore@main
        with:
          working_directory: ${{inputs.working_directory}}
          artifact_name: node_modules-release${{inputs.artifact_suffix}}

      - name: Install aqua
        if: inputs.aqua_version != ''
        uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: ${{inputs.aqua_version}}
        env:
          GITHUB_TOKEN: ${{github.token}}

      - name: Build the action
        working-directory: ${{inputs.working_directory}}
        env:
          BUILD_COMMAND: ${{inputs.build_command}}
          AQUA_GITHUB_TOKEN: ${{github.token}}
        run: bash -c "$BUILD_COMMAND"

      # Pull requests from forks can't push branches, so only build them
      - name: Release the action
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: suzuki-shunsuke/release-js-action@ff106e3a3f5b34f174a23db3110031fbf463f15c # v0.2.1
        with:
          version: ${{inputs.version}}
          pr: ${{inputs.pr}}
          is_comment: ${{inputs.is_comment}}
          files: ${{inputs.files}}

      # Callers can test the built action by downloading this artifact
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist${{inputs.artifact_suffix}}
          path: ${{inputs.working_directory}}/dist
          retention-days: 1
